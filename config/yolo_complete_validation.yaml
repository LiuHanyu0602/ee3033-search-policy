euler_camera_tf:
  ros__parameters:
    euler_topic: /robot_euler
    parent_frame: base_footprint
    child_frame: ee3033_balance_body
    expected_source_frame: base_footprint
    # /robot_euler is measured in radians: x=roll, y=pitch, z=yaw.
    # Yaw is deliberately ignored because map->base_footprint already has yaw.
    roll_scale: 1.0
    pitch_scale: 1.0
    roll_offset_rad: 0.0
    pitch_offset_rad: 0.0

# Provisional limits, NOT measured acceptance values. No robot launch by extraction.
search_manager:
  ros__parameters:
    navigation_enabled: false
    single_goal_mode: true
    max_navigation_goals: 1
    return_home_enabled: false
    exclusive_navigation_verified: false
    robot_geometry_verified: false
    scan_topic: /scan
    lease_timeout_s: 0.6
    tf_max_age_s: 0.3
    scan_max_age_s: 0.5
    observation_position_tolerance_m: 0.15
    observation_yaw_tolerance_rad: 0.25

target_mission_coordinator:
  ros__parameters:
    odom_topic: /odom
    odom_frame: odom_combined
    # Must remain false until the large-motion interrupt thresholds have been
    # validated on the physical robot.  This is not a stationary/PID gate.
    motion_interrupt_verified: false
    dynamic_camera_tf_verified: false
    stop_timeout_s: 12.0
    localization_timeout_s: 15.0
    mission_timeout_s: 300.0
    input_max_age_s: 0.5
    # Non-actuating validation never sends a Spin action.
    target_alignment_enabled: false
    spin_action: /spin
    alignment_deadband_rad: 0.17453
    alignment_residual_rad: 0.17453
    alignment_time_allowance_s: 8.0
    alignment_action_timeout_s: 10.0
    maximum_variance_m2: 0.25
    minimum_report_frames: 3
    report_consistency_m: 0.10
    # These invalidate accumulated localization observations only when the
    # robot moves substantially. Normal balancing jitter is intentionally
    # ignored; no zero-velocity or fixed-duration stillness is required.
    motion_interrupt_horizon_s: 0.5
    motion_interrupt_max_age_s: 0.3
    motion_interrupt_max_gap_s: 0.2
    motion_interrupt_max_translation_m: 0.15
    motion_interrupt_max_rotation_rad: 0.35

yolo_detection_adapter:
  ros__parameters:
    labels_file: ''
    input_format: ncnn_json
    detections_topic: /yolo/detections
    camera_info_topic: /camera_info
    geometry_verified: false
    required_frames: 3
    max_age_s: 0.5
    max_gap_s: 0.4
    minimum_iou: 0.2

stamped_target_localizer:
  ros__parameters:
    calibration_file: ''
    geometry_verified: false
    assume_ground_contact: false
    camera_info_topic: /camera_info
    scan_topic: /scan
    map_frame: map
    # Match each image-stamped detection to a nearby scan. Prefer LiDAR when
    # its map point agrees with the calibrated ground-plane projection.
    range_mode: lidar_then_ground
    maximum_age_s: 0.5
    minimum_range_m: 0.15
    maximum_range_m: 4.0
    scan_max_age_s: 0.75
    scan_sync_tolerance_s: 0.12
    scan_window_rad: 0.05236
    minimum_lidar_points: 2
    lidar_ground_gate_m: 0.35
    laser_yaw_offset_rad: 0.0
    scan_buffer_size: 50
    minimum_range_observations: 5
